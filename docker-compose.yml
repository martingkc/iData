# Todo's: 
# - Add a separate network for Postgres and milvus to improve security. ofc with a firewall or reverse proxy with connection limitations in between.

#

version: '3.5'
services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: idata-mongodb 
    ports:
      - "27017:27017"
    # MongoDB environment variables
    # MONGO_INITDB_DATABASE: The name of the default database to create
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    volumes:
      - mongodb_data:/var/lib/mongodb
    networks:
      - idata-network

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/var/lib/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - idata-network

  minio:
    container_name: milvus-minio
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/var/lib/minio
    command: minio server /var/lib/minio --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - idata-network

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.5
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - idata-network

  document_parser_backend:
    build: ./document_parser_backend
    container_name: document_parser_backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    environment:
      - CONTEXT_SUMMARIZATION_MODEL=${CONTEXT_SUMMARIZATION_MODEL}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_NAME=${MONGODB_NAME}
      - MONGODB_COLLECTION_NAME=${MONGODB_COLLECTION_NAME}
      - MONGODB_ADDRESS=${MONGODB_ADDRESS}
      - MONGODB_PORT=${MONGODB_PORT}
      - MILVUS_HOST=${MILVUS_HOST}
      - MILVUS_PORT=${MILVUS_PORT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    depends_on:
      - mongodb
      - standalone
    networks:
      - idata-network
    volumes:
      - ./document_parser_backend:/app/Backend
      - ./local-documents:/app/local-documents

  agent_backend:
    build: ./agent_backend
    container_name: agent_backend
    ports:
      - "5001:5001"
    environment:
      - CONTEXT_SUMMARIZATION_MODEL=${CONTEXT_SUMMARIZATION_MODEL}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_NAME=${MONGODB_NAME}
      - MONGODB_COLLECTION_NAME=${MONGODB_COLLECTION_NAME}
      - MONGODB_ADDRESS=${MONGODB_ADDRESS}
      - MONGODB_PORT=${MONGODB_PORT}
      - MILVUS_HOST=${MILVUS_HOST}
      - MILVUS_PORT=${MILVUS_PORT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - JUPYTER_MCP_URL=http://jupyterhub:8002/user/admin/mcp
      - JUPYTERHUB_API_TOKEN=7504d3b3244142a283bd7b5472c84a8c
      - JUPYTER_MCP_COMMAND=npx
      - UV_USE_IO_URING=0
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}

    depends_on:
      - mongodb
      - standalone
      - postgres
    networks:
      - idata-network
    volumes:
      - ./agent_backend:/app
      - ./local-documents:/app/local-documents
    
  document_collector:
    image : document_collector:0.0.2
    build: ./document_collector
    container_name: document_collector
    env_file:
      - .env
    environment:
      - CONFIGS_FOLDER_PATH=/app/configs
      - CONFIG_FILE_RELATIVE_PATH=${CONFIG_FILE_RELATIVE_PATH}
      - LOCAL_DOCUMENTS_FOLDER_PATH=${LOCAL_DOCUMENTS_FOLDER_PATH}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_NAME=${MONGODB_NAME}
      - MONGODB_COLLECTION_NAME=${MONGODB_COLLECTION_NAME}
      - MONGODB_ADDRESS=${MONGODB_ADDRESS}
      - MONGODB_PORT=${MONGODB_PORT}
      - PORT=8001
    ports:
      - "8001:8001"
    networks:
      - idata-network
    volumes:
      - ./local-documents:/app/local-documents
      - ./configs:/app/configs
      - ./logs:/app/logs
  postgres:
    # see https://hub.docker.com/_/postgres for list of postgres image versions on docker hub
    #image: postgres:latest # To download the latest image
    #image: postgres:17.4-alpine # To download a specific version, here the version 17.4 of Postgresql under an alpine linux distribution
    image: postgres # To download a specific version, here the version 17.4 of Postgresql
    container_name: postgres
    volumes:
      - ./postgreSQL/dump.sql:/docker-entrypoint-initdb.d/00_dump.sql:ro
      - ./postgreSQL:/repo
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # HOST_PORT:CONTAINER_PORT
    networks:
      - idata-network
  pgadmin:
    # see https://hub.docker.com/r/dpage/pgadmin4
    image: dpage/pgadmin4:latest # To download the latest image
    container_name: pgadmin
    volumes:
      - pgadmin_working_dir:/var/lib/pgadmin
      - pgadmin_config_dir:/pgadmin4
    env_file:
      - .env    
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    ports:
      - "5433:80" # HOST_PORT:CONTAINER_PORT
    networks:
      - idata-network

  frontend:
    build: ./Frontend
    container_name: idata-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    depends_on:
      - agent_backend
    networks:
      - idata-network


volumes:
  mongodb_data:
  milvus_data:
  etcd_data:
  minio_data:
  app_data:
  postgresql_data:
    driver: local
  pgadmin_working_dir:
    driver: local
  pgadmin_config_dir:
    driver: local
  jupyterhub_data:
    driver: local

networks:
  idata-network:
